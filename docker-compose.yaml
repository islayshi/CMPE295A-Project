version: '3.8'

# ============================================================
# Fight Fire With AI — Local Development Docker Compose
# ============================================================
# Replicates the GCP production topology locally:
#   - PostGIS  → replaces Cloud SQL (PostgreSQL + PostGIS)
#   - Redis    → replaces Memorystore
#   - backend  → Django REST API (runs with `python manage.py runserver`)
#
# Usage:
#   docker compose up -d        # start all services in background
#   docker compose down         # stop all services
#   docker compose logs -f db   # tail postgres logs
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL + PostGIS (Cloud SQL equivalent)
  # ----------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: ffwai_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis (Memorystore equivalent)
  # Serves dual-duty: Celery message broker + GeoJSON cache
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ffwai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # U-Net Inference Service (Port 8081)
  # ----------------------------------------------------------
  unet-service:
    build:
      context: ./ml_services/unet_service
      dockerfile: Dockerfile
    container_name: ffwai_unet_service
    environment:
      AIP_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./ml_services/unet_service/settings.py:/app/settings.py
      - ./ml_services/unet_service/postprocessing.py:/app/postprocessing.py
      - ./ml_services/unet_service/native_ingestion.py:/app/native_ingestion.py
      - ./ml_services/unet_service/inference.py:/app/inference.py
      - ./ml_services/unet_service/serve.py:/app/serve.py
      - goes_cache:/tmp/goes_cache
    restart: unless-stopped

  # ----------------------------------------------------------
  # PINN Inference Service (Port 8082)
  # ----------------------------------------------------------
  pinn-service:
    build:
      context: ./ml_services/ml_pinn_service
      dockerfile: Dockerfile
    container_name: ffwai_pinn_service
    environment:
      AIP_HTTP_PORT: 8082
      INGESTION: ${PINN_INGESTION:-native}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-b4858267b75c999edb2cc1b152881eb0}
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  goes_cache: